<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf1fb">
<title>الوطني</title>
<meta name="application-name" content="الوطني">
<meta name="apple-mobile-web-app-title" content="الوطني">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --text:#0a0a0a; --mute:#4b5157; --line:rgba(13,42,74,.14);
    --bg1:#eaf1fb; --bg2:#dce8fb; --blob1:rgba(96,165,250,.40); --blob2:rgba(45,212,191,.28);
    --glass:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.7); --glass-sh:0 8px 30px rgba(13,42,74,.10);
    --accent:#2563eb;
    --on:#16a34a; --onfill:#2fcf71; --off:#dc2626; --unk:#94a3b8;
    --onbg:rgba(52,199,89,.16); --onbrd:rgba(22,163,74,.30);
    --offbg:rgba(220,38,38,.12); --offbrd:rgba(220,38,38,.30);
    --unkbg:rgba(148,163,184,.14); --unkbrd:rgba(13,42,74,.12);
    --nodata:rgba(13,42,74,.07); --rowhover:rgba(13,42,74,.05); --sel:rgba(37,99,235,.13);
    --seg-bg:rgba(13,42,74,.05); --seg-act:rgba(255,255,255,.85);
    --pill:rgba(255,255,255,.6);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    color-scheme:dark;
    --text:#ffffff; --mute:#c3ccd6; --line:rgba(255,255,255,.14);
    --bg1:#0b1222; --bg2:#0e1830; --blob1:rgba(59,130,246,.22); --blob2:rgba(16,185,129,.16);
    --glass:rgba(20,28,44,.55); --glass-brd:rgba(255,255,255,.10); --glass-sh:0 8px 30px rgba(0,0,0,.40);
    --accent:#3b82f6;
    --onbg:rgba(34,197,94,.18); --onbrd:rgba(52,199,89,.35);
    --offbg:rgba(239,68,68,.20); --offbrd:rgba(248,113,113,.40);
    --unkbg:rgba(255,255,255,.05); --unkbrd:rgba(255,255,255,.12);
    --nodata:rgba(255,255,255,.08); --rowhover:rgba(255,255,255,.06); --sel:rgba(59,130,246,.22);
    --seg-bg:rgba(255,255,255,.06); --seg-act:rgba(255,255,255,.14);
    --pill:rgba(255,255,255,.10);
  } }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --text:#ffffff; --mute:#c3ccd6; --line:rgba(255,255,255,.14);
    --bg1:#0b1222; --bg2:#0e1830; --blob1:rgba(59,130,246,.22); --blob2:rgba(16,185,129,.16);
    --glass:rgba(20,28,44,.55); --glass-brd:rgba(255,255,255,.10); --glass-sh:0 8px 30px rgba(0,0,0,.40);
    --accent:#3b82f6;
    --onbg:rgba(34,197,94,.18); --onbrd:rgba(52,199,89,.35);
    --offbg:rgba(239,68,68,.20); --offbrd:rgba(248,113,113,.40);
    --unkbg:rgba(255,255,255,.05); --unkbrd:rgba(255,255,255,.12);
    --nodata:rgba(255,255,255,.08); --rowhover:rgba(255,255,255,.06); --sel:rgba(59,130,246,.22);
    --seg-bg:rgba(255,255,255,.06); --seg-act:rgba(255,255,255,.14);
    --pill:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);line-height:1.6;font-size:15px;
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 26px);
    max-width:560px;margin:0 auto}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(42% 30% at 12% 8%,var(--blob1),transparent 70%),radial-gradient(46% 34% at 88% 16%,var(--blob2),transparent 70%)}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-brd);background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--glass-sh);
    font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:14px;margin-bottom:12px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--glass-sh)}
  .banner{border-radius:18px;padding:14px 16px;margin-bottom:12px;border:1px solid;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--glass-sh)}
  .banner.on{background:var(--onbg);border-color:var(--onbrd)}
  .banner.off{background:var(--offbg);border-color:var(--offbrd)}
  .banner.unk{background:var(--unkbg);border-color:var(--unkbrd)}
  .bmain{display:flex;align-items:center;gap:13px}
  .btext{flex:1;min-width:0}
  .trow{display:flex;align-items:center;gap:8px}
  .upd{flex:none;background:var(--pill);border:1px solid var(--glass-brd);color:var(--mute);font-size:11px;border-radius:999px;padding:4px 9px;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .dot{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:23px}
  .banner.on .dot{background:var(--on)} .banner.off .dot{background:var(--off)} .banner.unk .dot{background:var(--unk)}
  .banner .t{flex:1;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .banner .s{font-size:13.5px;color:var(--mute);margin-top:1px}
  /* period selector */
  .seg{display:flex;background:var(--seg-bg);border:1px solid var(--glass-brd);border-radius:13px;padding:4px;margin-bottom:10px;gap:2px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .seg button{flex:1;border:none;background:transparent;color:var(--mute);font-size:12.5px;font-weight:600;
    padding:9px 1px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .seg button.act{background:var(--seg-act);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .custom{display:none;gap:8px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
  .custom.show{display:flex}
  .fld{flex:1;min-width:110px}
  .fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
  .fld input{width:100%;border:1px solid var(--glass-brd);border-radius:10px;padding:9px 10px;font-size:14px;
    font-family:inherit;color:var(--text);background:var(--glass)}
  .custom .go{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
  h3{font-size:14px;color:var(--mute);font-weight:600;margin-bottom:10px}
  .hint{font-size:11.5px;color:var(--mute);margin:-4px 0 10px}
  /* timeline */
  .tl-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--mute);font-weight:600}
  .tl-head .barlbl{flex:1;text-align:center}
  .tl-head .cnt{color:var(--mute);font-weight:600}
  .tl-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;cursor:pointer;padding:3px 4px;border-radius:9px;transition:.12s}
  .tl-row:active{background:var(--rowhover)}
  .tl-row.sel{background:var(--sel)}
  .tl-row.sel .d{color:var(--text);font-weight:700}
  .tl-row.sel .bar{box-shadow:0 0 0 2px var(--text)}
  .d{width:74px;font-size:11px;color:var(--mute);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{flex:1;height:14px;border-radius:5px;background:var(--nodata);position:relative;overflow:hidden;border:1px solid var(--line)}
  .bar i{position:absolute;top:0;bottom:0}
  .bar i.on{background:var(--onfill)}
  .bar i.off{background:var(--off)}
  .cnt{width:30px;flex:none;text-align:center;font-size:13px;font-weight:700;color:var(--off);font-variant-numeric:tabular-nums}
  .cnt.z{color:var(--unk);font-weight:500}
  .dsum{width:52px;flex:none;text-align:left;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .tl-row.sel .dsum{color:var(--text);font-weight:600}
  .legend{display:flex;gap:12px;justify-content:center;margin-top:12px;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:13px;height:10px;border-radius:3px;display:inline-block}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:7px 5px;border-bottom:1px solid var(--line)}
  td{padding:9px 5px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
  tr:last-child td{border-bottom:none}
  .empty{text-align:center;color:var(--mute);padding:16px}
  .foot{text-align:center;font-size:12px;color:var(--mute);margin-top:6px;line-height:1.8}
  .err{background:var(--offbg);border:1px solid var(--offbrd);color:var(--off);border-radius:12px;padding:12px;text-align:center;font-size:14px;display:none}
</style>
</head>
<body>
  <div class="topbar">
    <button id="themeBtn" class="iconbtn" aria-label="تبديل الوضع ليل/نهار">🌙</button>
  </div>

  <div id="err" class="err"></div>

  <div id="banner" class="banner unk">
    <div class="bmain">
      <div class="dot">⚪</div>
      <div class="btext">
        <div class="trow"><span class="t" id="bTitle">—</span><span class="upd" id="updated">جارِ التحميل…</span></div>
        <div class="s" id="bSub"></div>
      </div>
    </div>
  </div>

  <!-- period selector -->
  <div class="seg" id="seg">
    <button data-m="w1" class="act">أسبوع</button>
    <button data-m="w2">أسبوعين</button>
    <button data-m="w3">٣ أسابيع</button>
    <button data-m="month">الشهر</button>
    <button data-m="custom">مخصّص</button>
  </div>
  <div class="custom" id="custom">
    <div class="fld"><label>من</label><input type="date" id="fromD"></div>
    <div class="fld"><label>إلى</label><input type="date" id="toD"></div>
    <button class="go" id="goBtn">عرض</button>
  </div>

  <div class="card">
    <div class="tl-head">
      <span class="d"></span>
      <span class="barlbl">خلال اليوم (٢٤ ساعة)</span>
      <span class="cnt">عدد</span>
      <span class="dsum">المدة</span>
    </div>
    <div id="timeline"></div>
    <div class="legend">
      <span><i style="background:var(--onfill)"></i> موجودة</span>
      <span><i style="background:var(--off)"></i> مقطوعة</span>
      <span><i style="background:var(--nodata);border:1px solid var(--line)"></i> لا توجد بيانات</span>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>اليوم</th><th>من</th><th>إلى</th><th>المدة</th></tr></thead>
      <tbody id="outBody"><tr><td colspan="4" class="empty"><span style="color:var(--mute)">…</span></td></tr></tbody>
    </table>
  </div>

  <div class="foot">
    © جميع الحقوق محفوظة · مثنى الصافي
  </div>

<script>
const API = "https://bxumslcuwunqkidutevk.supabase.co/functions/v1/solar-grid?k=a990c3f834ee8c7c00dedba9";
const TZ = "Asia/Baghdad";
const DAY = 86400e3;
const $ = (id) => document.getElementById(id);
let mode = "w1";
let selDay = "";                 // selected day key (from timeline click), "" = all
let lastOuts = [], lastRange = null;

const tm = (d) => new Date(d).toLocaleTimeString("ar-IQ", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
const dayName = (d) => new Date(d).toLocaleDateString("ar-IQ", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric" });
const ar = (n) => Number(n).toLocaleString("ar-IQ");
function dur(ms){ const m = Math.max(0, Math.round(ms/60000)), h = Math.floor(m/60); return h ? `${ar(h)} س ${ar(m%60)} د` : `${ar(m)} د`; }
// relative-day prefix for a timestamp (returns "", "أمس ", "أول أمس ", "قبل N أيام ")
function relDay(d){
  const diff = Math.round((dayStart(keyOf(new Date())) - dayStart(keyOf(new Date(d)))) / DAY);
  if (diff <= 0) return "";
  if (diff === 1) return "أمس ";
  if (diff === 2) return "أول أمس ";
  const unit = diff <= 10 ? "أيام" : "يومًا";
  return `قبل ${ar(diff)} ${unit} `;
}

const keyOf = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d);
const dayStart = (key) => new Date(key + "T00:00:00+03:00").getTime();

function range(){
  const today = keyOf(new Date());
  if (mode === "custom"){
    let f = $("fromD").value || today, t = $("toD").value || today;
    if (f > t) [f, t] = [t, f];
    return { from:f, to:t, title:`${f} ← ${t}` };
  }
  if (mode === "month"){
    const p = new Intl.DateTimeFormat("en-CA",{ timeZone:TZ, year:"numeric", month:"2-digit" }).format(new Date());
    const [y,m] = p.split("-").map(Number);
    const last = new Date(y, m, 0).getDate(), mm = String(m).padStart(2,"0");
    return { from:`${y}-${mm}-01`, to:`${y}-${mm}-${String(last).padStart(2,"0")}`, title:"الشهر الحالي" };
  }
  const n = mode === "w1" ? 7 : mode === "w2" ? 14 : 21;
  return { from: keyOf(new Date(Date.now() - (n-1)*DAY)), to: today, title: mode==="w1"?"أسبوع":mode==="w2"?"أسبوعين":"٣ أسابيع" };
}

async function load(){
  const r = range();
  try{
    const res = await fetch(`${API}&from=${r.from}&to=${r.to}`, { cache:"no-store" });
    if(!res.ok) throw new Error(res.status === 403 ? "الرابط لم يعد صالحاً" : "تعذّر الاتصال ("+res.status+")");
    render(await res.json(), r);
    $("err").style.display = "none";
  }catch(e){ const up=$("updated"); up.textContent = "⚠️ غير متصل"; up.style.display = ""; $("err").textContent = e.message; $("err").style.display = "block"; }
}

function render(d, r){
  const outs = d.outages || [];
  const now = Date.now();
  const since = d.since ? new Date(d.since).getTime() : Infinity;

  // updates run every minute, so only surface the pill when data is stale/missing
  const ok = d.last_ok ? new Date(d.last_ok) : null;
  const ageMin = ok ? (now - ok.getTime())/60000 : null;
  const up = $("updated");
  if (ok && ageMin > 6){ up.textContent = "⚠️ قبل " + dur(now - ok.getTime()); up.style.display = ""; }
  else if (!ok){ up.textContent = "⚠️ لا قراءات"; up.style.display = ""; }
  else { up.style.display = "none"; }

  const b = $("banner"), open = outs.find(o => !o.ended_at), lastEnded = outs.find(o => o.ended_at);
  if(d.grid_on === true){
    b.className = "banner on"; b.querySelector(".dot").textContent = "🟢";
    $("bTitle").textContent = "الوطنية موجودة الآن";
    $("bSub").textContent = lastEnded ? "رجعت " + relDay(lastEnded.ended_at) + "الساعة " + tm(lastEnded.ended_at) : "";
  } else if(d.grid_on === false){
    b.className = "banner off"; b.querySelector(".dot").textContent = "🔴";
    $("bTitle").textContent = "الوطنية مقطوعة الآن";
    $("bSub").textContent = open ? `منذ ${dur(now-new Date(open.started_at).getTime())} · انقطعت ${relDay(open.started_at)}${tm(open.started_at)}` : "";
  } else {
    b.className = "banner unk"; b.querySelector(".dot").textContent = "⚪";
    $("bTitle").textContent = "غير معروف"; $("bSub").textContent = "";
  }

  // timeline rows: اليوم | شريط | عدد | إجمالي المدة
  const sFrom = dayStart(r.from), sTo = dayStart(r.to);
  const n = Math.min(Math.round((sTo - sFrom)/DAY) + 1, 62);
  const todayStart = dayStart(keyOf(new Date()));
  const validKeys = new Set();
  const rows = [];
  for(let i=0;i<n;i++){
    const dayS = sTo - i*DAY, dayE = dayS + DAY, key = keyOf(new Date(dayS));
    validKeys.add(key);
    let segs = "", offMs = 0, offCount = 0;
    const gS = Math.max(dayS, since), gE = Math.min(dayE, now);
    if(gE > gS) segs += `<i class="on" style="right:${(gS-dayS)/DAY*100}%;width:${(gE-gS)/DAY*100}%"></i>`;
    for(const o of outs){
      const a = Math.max(dayS, new Date(o.started_at).getTime());
      const z = Math.min(dayE, o.ended_at ? new Date(o.ended_at).getTime() : now);
      if(z > a){ segs += `<i class="off" style="right:${(a-dayS)/DAY*100}%;width:${(z-a)/DAY*100}%"></i>`; offMs += z - a; offCount++; }
    }
    const label = dayS === todayStart ? "اليوم" : dayName(dayS);
    rows.push(`<div class="tl-row" data-key="${key}"><span class="d">${label}</span><div class="bar">${segs}</div>`
      + `<span class="cnt${offCount?'':' z'}">${offCount ? ar(offCount) : "٠"}</span>`
      + `<span class="dsum">${offMs > 0 ? dur(offMs) : "٠"}</span></div>`);
  }
  $("timeline").innerHTML = rows.join("");

  // keep the day selection only if still in range
  if(selDay && !validKeys.has(selDay)) selDay = "";
  lastOuts = outs; lastRange = r;
  highlightDay();
  renderLog();
}

function highlightDay(){
  document.querySelectorAll("#timeline .tl-row").forEach(r => r.classList.toggle("sel", !!selDay && r.dataset.key === selDay));
}

function renderLog(){
  const list = selDay ? lastOuts.filter(o => keyOf(new Date(o.started_at)) === selDay) : lastOuts;
  const emptyMsg = selDay ? "لا توجد انقطاعات في هذا اليوم" : "لا توجد انقطاعات مسجّلة في هذه المدة";
  $("outBody").innerHTML = list.length ? list.map(o => {
    const end = o.ended_at ? tm(o.ended_at) : "<b style='color:var(--off)'>مستمر</b>";
    const ms = (o.ended_at ? new Date(o.ended_at) : new Date()) - new Date(o.started_at);
    return `<tr><td>${dayName(o.started_at)}</td><td>${tm(o.started_at)}</td><td>${end}</td><td>${dur(ms)}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">${emptyMsg}</td></tr>`;
}

function busy(){ $("outBody").innerHTML = `<tr><td colspan="4" class="empty"><span style="color:var(--mute)">…</span></td></tr>`; }

// period selector
$("seg").addEventListener("click", (e) => {
  const btn = e.target.closest("button"); if(!btn) return;
  mode = btn.dataset.m; selDay = "";
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("act", x === btn));
  $("custom").classList.toggle("show", mode === "custom");
  if(mode !== "custom"){ busy(); load(); }
});
$("goBtn").addEventListener("click", () => { selDay = ""; busy(); load(); });

// click a timeline day → filter the log (click again to clear)
$("timeline").addEventListener("click", (e) => {
  const row = e.target.closest(".tl-row"); if(!row) return;
  selDay = (selDay === row.dataset.key) ? "" : row.dataset.key;
  highlightDay(); renderLog();
  $("outBody").scrollIntoView({ behavior:"smooth", block:"center" });
});

(function initDates(){
  const today = keyOf(new Date()), weekAgo = keyOf(new Date(Date.now() - 6*DAY));
  $("toD").value = today; $("toD").max = today;
  $("fromD").value = weekAgo; $("fromD").max = today;
})();

// ===== theme (day / night) =====
(function(){
  const root = document.documentElement, btn = $("themeBtn");
  const prefersDark = () => window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = () => { const t = root.getAttribute("data-theme"); return t ? t === "dark" : prefersDark(); };
  function paint(){
    if(btn) btn.textContent = isDark() ? "☀️" : "🌙";
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", isDark() ? "#0b1222" : "#eaf1fb");
  }
  try{ const s = localStorage.getItem("theme"); if(s === "dark" || s === "light") root.setAttribute("data-theme", s); }catch(e){}
  paint();
  if(btn) btn.addEventListener("click", () => {
    const d = !isDark();
    root.setAttribute("data-theme", d ? "dark" : "light");
    try{ localStorage.setItem("theme", d ? "dark" : "light"); }catch(e){}
    paint();
  });
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(!root.getAttribute("data-theme")) paint(); }); }catch(e){}
})();

selDay = keyOf(new Date());   // focus on the current day when the app opens
load();
setInterval(() => { if(!document.hidden && mode !== "custom") load(); }, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && mode !== "custom") load(); });
</script>
</body>
</html>
